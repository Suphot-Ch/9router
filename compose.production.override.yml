# Apply only to the existing 9router service; preserve env, data and networks.
# docker compose -f /home/user/ai-local/primus-ai/docker-compose.yml \
#   -f /home/user/workspace/9router-release-ch8/compose.production.override.yml \
#   up -d --no-deps --pull never 9router
services:
  9router:
    image: rd-primus/9router:0.5.119-ch8
    pull_policy: never

    environment:
      KEY_RATE_LIMIT_MODE: single-process
